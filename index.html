<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuckySpin — Physics-Based Lucky Draw Wheel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient Background Glows -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
  </div>

  <!-- Confetti Overlay Canvas -->
  <canvas id="confettiCanvas" aria-hidden="true"></canvas>

  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="3"/>
            <line x1="12" y1="2" x2="12" y2="9"/>
            <line x1="12" y1="15" x2="12" y2="22"/>
            <line x1="4.93" y1="4.93" x2="9.88" y2="9.88"/>
            <line x1="14.12" y1="14.12" x2="19.07" y2="19.07"/>
            <line x1="2" y1="12" x2="9" y2="12"/>
            <line x1="15" y1="12" x2="22" y2="12"/>
          </svg>
        </div>
        <div>
          <h1>LuckySpin</h1>
          <p class="subtitle">Physics-Based Lucky Draw Wheel</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="live-readout" id="liveReadoutBox" title="Number currently under the pointer">
          <span class="readout-label">Current Pointer</span>
          <span class="readout-value" id="currentPointerNumber">--</span>
        </div>

        <button type="button" id="soundToggleBtn" class="icon-btn" aria-label="Toggle Sound" title="Toggle mechanical wheel sound effects">
          <svg id="soundOnIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="soundOffIcon" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Layout -->
    <main class="main-grid">
      <!-- Left Control Panel -->
      <aside class="control-panel">
        <!-- Number Range Card -->
        <section class="glass-card">
          <div class="card-header">
            <h2>Number Range</h2>
            <span class="badge" id="sliceCountBadge">20 Numbers</span>
          </div>

          <form id="rangeForm" class="range-form">
            <div class="range-inputs">
              <div class="input-group">
                <label for="startNumber">From (A)</label>
                <input type="number" id="startNumber" value="1" min="-9999" max="99999" required />
              </div>
              <div class="range-divider">
                <span>to</span>
              </div>
              <div class="input-group">
                <label for="endNumber">To (B)</label>
                <input type="number" id="endNumber" value="20" min="-9999" max="99999" required />
              </div>
            </div>

            <div class="preset-chips">
              <span class="preset-label">Presets:</span>
              <button type="button" class="chip" data-start="1" data-end="10">1 ~ 10</button>
              <button type="button" class="chip active" data-start="1" data-end="20">1 ~ 20</button>
              <button type="button" class="chip" data-start="1" data-end="50">1 ~ 50</button>
              <button type="button" class="chip" data-start="1" data-end="100">1 ~ 100</button>
            </div>

            <p id="rangeError" class="error-msg hidden"></p>

            <button type="submit" id="generateWheelBtn" class="secondary-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
              </svg>
              Generate / Reset Wheel
            </button>
          </form>

          <div class="divider"></div>

          <!-- Physics & Rules Options -->
          <div class="options-list">
            <label class="toggle-row" for="removeWinnerToggle">
              <div class="toggle-info">
                <span class="toggle-title">Eliminate Winner After Draw</span>
                <span class="toggle-desc">Prevent drawing the same number twice</span>
              </div>
              <input type="checkbox" id="removeWinnerToggle" />
              <span class="toggle-switch"></span>
            </label>

            <div class="select-row">
              <label for="frictionPreset">Physics Damping &amp; Suspense</label>
              <select id="frictionPreset">
                <option value="quick">Quick Spin (~4s)</option>
                <option value="standard" selected>Standard Inertia (~6.5s)</option>
                <option value="suspense">High Suspense Glide (~9.5s)</option>
              </select>
            </div>
          </div>
        </section>

        <!-- Draw History Card -->
        <section class="glass-card history-card">
          <div class="card-header">
            <h2>Draw History</h2>
            <button type="button" id="clearHistoryBtn" class="text-btn" disabled>Clear</button>
          </div>
          <div id="historyList" class="history-list">
            <div class="empty-state">No draws yet. Spin the wheel to begin!</div>
          </div>
        </section>
      </aside>

      <!-- Center Wheel Stage -->
      <section class="wheel-stage">
        <div class="wheel-wrapper">
          <!-- Outer decorative ring & shadow -->
          <div class="wheel-frame">
            <canvas id="wheelCanvas" width="900" height="900"></canvas>

            <!-- Center Spin Hub Button -->
            <button type="button" id="centerSpinBtn" class="center-hub-btn" aria-label="Start Spin">
              <span class="hub-ring"></span>
              <span class="hub-text">SPIN</span>
              <span class="hub-sub">TAP TO DRAW</span>
            </button>
          </div>
        </div>

        <!-- Bottom Primary CTA & Physics Telemetry -->
        <div class="stage-controls">
          <button type="button" id="mainSpinBtn" class="primary-spin-btn">
            <span class="btn-glow"></span>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span id="spinBtnLabel">Spin the Wheel</span>
          </button>

          <div class="physics-status">
            <div class="status-pill">
              <span class="dot" id="stateDot"></span>
              <span id="stateText">Ready</span>
            </div>
            <div class="speed-meter" title="Real-time Angular Velocity">
              <span>Velocity</span>
              <div class="speed-bar-track">
                <div class="speed-bar-fill" id="speedBarFill"></div>
              </div>
              <span id="speedValue" class="mono-num">0.0 rad/s</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Winner Announcement Modal -->
  <div id="winnerModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="winnerModalTitle">
    <div class="modal-card">
      <div class="modal-sparkles" aria-hidden="true">✦ ✧ ★ ✧ ✦</div>
      <p id="winnerModalTitle" class="modal-eyebrow">LUCKY WINNER</p>
      <h2 class="modal-subtitle">We Have a Lucky Number!</h2>

      <div class="winner-number-badge" id="winnerBadge">
        <span class="number-prefix">#</span>
        <span id="winnerNumberDisplay" class="winner-number">8</span>
      </div>

      <p class="winner-meta" id="winnerMetaText">Selected from 20 numbers</p>

      <div class="modal-actions">
        <button type="button" id="keepAndCloseBtn" class="modal-btn primary">Done</button>
        <button type="button" id="removeAndCloseBtn" class="modal-btn outline">Remove Number &amp; Continue</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
